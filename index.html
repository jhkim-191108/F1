<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="중고거래 상품을 검색하고 확인할 수 있는 서비스입니다.">
    <title>당근마켓 검색</title>
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./header.css">
    <link rel="stylesheet" href="./search.css">
</head>
<body>
    <!-- 상단Header -->
    <header class="upper-bar">
        <!-- header내부 섹션1 : 로고 및 중고거래 동네인증 버튼 -->
        <nav id="upper-bar-left">
        <!-- 로고 이미지 + 홈화면 링크 -->
            <a href="./index.html">
                <img src="./img/logo.png" alt="당근로고" class="upper-logo">
            </a>
            <!-- 로고 이미지 옆 버튼 묶음 div -->
            <div class="upper-left-text">
                <a href="./index.html" class="main-logo-text">중고거래</a>
                <a href="./location.html" class="location-verify">동네인증</a>
            </div>
        </nav>
        <!-- header 내부 섹션2 : flex, gap이 10으로 동일하기 때문에 따로 나눠서 감싸지 않음-->
        <div id="upper-bar-right">
            <!-- 검색창 js로 엔터눌러 검색 등을 하기 위해 form으로 감쌈-->
            <form id="search-form">
                <input type="text" name="search" id="search-text-area" placeholder="물품이나 동네를 검색해보세요">
            </form>
            <!-- 채팅하기버튼 -->
            <a href="./chat" id="upper-chat-button">채팅하기</a>
            <!-- 로그아웃버튼 -->
            <button id="upper-logout-button">로그아웃</button>
        </div>
    </header>
        <!-- 메인 -->
        <main id="main">
            <!-- 메인섹션 전체 박스 section그 아래div 여기에 그리드 적용 -->
            <section id="main-section-grid">
                <!-- 여기에 JS에서 받아온 카드들이 들어올 예정 -->
            </section>
            <!-- 하단 페이지 넘기기 버튼 -->
            <nav id="page-list" aria-label="상품 페이지 조작">
                <button id="prev-page"aria-label="이전 페이지"></button>
                <span id="page-nums" aria-label="페이지 번호">1 / 1</span>
                <button id="next-page"aria-label="다음 페이지"></button>
            </nav>
        </main>
    <script src="search.js"></script>
</body>
</html>
