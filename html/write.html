<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>write</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/write.css" />
    <link rel="stylesheet" href="../css/trade-post.css" />
  </head>
  <body>
    <!-- 글쓰기 -->
    <!-- 헤더 -->
    <!-- 메인 -->
    <main>
      <!-- 메인 컨테이너 -->
      <div class="main-con">
        <!-- 글쓰기 콘텐츠 -->
        <article class="write">
          <!-- 콘텐츠 - 이미지 + 제목 + 가격 -->
          <div class="write-box-1">
            <!-- 사진 등록 -->
            <div class="img-box">
              <img
                class="icon-camera"
                src="../images/write-add-img.png"
                alt="카메라 아이콘"
              />
            </div>
            <!-- 글 정보 -->
            <div class="write-info">
              <!-- 글 제목 -->
              <div class="write-title-box input-box">
                <!-- 글 제목 - 텍스트 -->
                <label for="write-title">글 제목</label>
                <!-- 글 제목 - 입력란 -->
                <input
                  type="text"
                  id="write-title"
                  name="title"
                  placeholder="글 제목"
                />
              </div>
              <!-- 가격 -->
              <div class="write-price-box input-box">
                <!-- 가격 - 텍스트 -->
                <label for="write-price">가격</label>
                <!-- 가격 - 입력란 -->
                <input
                  type="text"
                  id="write-price"
                  name="price"
                  placeholder="가격"
                />
              </div>
            </div>
          </div>

          <!-- 콘텐츠 - 물품 설명 + 거래 희망 장소-->
          <div class="write-box-2">
            <!-- 물품 설명 -->
            <div class="write-desc-box input-box">
              <!-- 물품 설명 - 텍스트 -->
              <label for="write-desc">물품 설명</label>
              <!-- 물품 설명 - 입력란 -->
              <textarea
                name="desc"
                id="write-desc"
                placeholder="게시글 내용을 작성해주세요."
              ></textarea>
            </div>

            <!-- 거래 희망 장소 -->
            <div class="write-place-box input-box">
              <!-- 거래 희망 장소 - 텍스트 -->
              <label for="write-place">거래 희망 장소</label>
              <!-- 거래 희망 장소 - 입력란 -->
              <input
                type="text"
                id="write-place"
                name="place"
                placeholder="거래를 희망하는 장소"
              />
            </div>
          </div>

          <!-- 콘텐츠 - 완료 버튼 -->
          <button class="btn-done">완료</button>
        </article>
      </div>
    </main>
    <script src="../js/write.js"></script>
  </body>
</html>
