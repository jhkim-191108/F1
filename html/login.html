<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>당근마켓</title>

    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
    <main class="register">
        <form class="register-form" id ="loginForm">
            <div class="register-field">
                <label for="userId">아이디</label>
                <input type="text" id="userId" name="userId" placeholder="아이디를 입력해주세요" />
            </div>
            <div class="register-field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요" />
            </div>
            
            <button type="submit" class="register-btn">로그인</button>
            <button type="submit" class="register-btn google-btn">
                <img src="../images/icon-google.png" alt="">
                Google로 로그인</button>
            <p class="register-guide">당근마켓 회원이 아니신가요?</p>
            <a href="./login.html" class="register-login">회원가입</a>
        </form>
    </main>
</body>
</html>
