<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>

    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/mypage.css" />
</head>
<body>
    <header class="upperBar">
        <!-- header내부 섹션1 : 로고 및 중고거래 동네인증 버튼 -->
        <nav id="upperBarLeft">
        <!-- 로고 이미지 + 홈화면 링크 -->
            <a href="./index.html">
                <img src="../images/logo.png" alt="당근로고" class="upperLogo">
            </a>
            <!-- 로고 이미지 옆 버튼 묶음 div -->
            <div class="upperLeftText">
                <a href="./index.html" class="mainLogoText">중고거래</a>
                <a href="./location.html" class="locationVerify">동네인증</a>
            </div>
        </nav>
        <!-- header 내부 섹션2 : flex, gap이 10으로 동일하기 때문에 따로 나눠서 감싸지 않음-->
        <div id="upperBarRight">
            <!-- 검색창 js로 엔터눌러 검색 등을 하기 위해 form으로 감쌈-->
            <form id="searchForm">
                <input type="search" name="search" id="searchTextArea" placeholder="물품이나 동네를 검색해보세요">
            </form>
            <!-- 로그아웃 상태에서만 보일 버튼 -->
            <div id="logoutStatusHeader">
                <a href="./login.html" id="upperLoginButton">로그인</a>
            </div>
            
            <!-- 로그인 상태에서만 보일 버튼 -->
            <div id="loginStatusHeader" hidden>
                <!-- 채팅하기버튼 -->
                <a href="./chat.html" id="upperChatButton">채팅하기</a>
                <!-- 로그아웃버튼 -->
                <button type="button" id="upperLogoutButton">로그아웃</button>
            </div>
        </div>
    </header>
    <main class="mypage">
        <section class="mypage-card">
            <h1 class="mypage-title">마이페이지</h1>

            <div class="mypage-profile">
                <div class="mypage-avatar" id="profileImage"></div>
                <p class="mypage-nickname" id="nickname"></p>
                <p class="mypage-email" id="email"></p>
                <p class="mypage-location" id="location"></p>
                <p class="mypage-date" id="createdAt"></p>
            </div>

            <form class="mypage-form" id="mypageForm">
                <div class="mypage-field">
                    <label for="nicknameInput">닉네임</label>
                    <input type="text" id="nicknameInput" name="nickname" placeholder="닉네임을 입력해주세요" />
                </div>
                <div class="mypage-field">
                    <label for="locationInput">지역</label>
                    <input type="text" id="locationInput" name="location" placeholder="지역을 입력해주세요" />
                </div>
                <div class="mypage-field">
                    <label for="profileImageInput">프로필 이미지 URL</label>
                    <input type="text" id="profileImageInput" name="profileImage" placeholder="이미지 URL을 입력해주세요" />
                </div>
                <button type="submit" class="mypage-btn">정보 수정</button>
            </form>
        </section>
    </main>
    <script src="../js/mypage.js"></script>
    <script src="../header.js"></script>
</body>
</html>
