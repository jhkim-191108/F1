<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>당근 - 동네인증</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/location.css">
</head>
<body>
    <!-- 상단Header -->
    <header class="upperBar">
        <!-- header내부 섹션1 : 로고 및 중고거래 동네인증 버튼 -->
        <nav id="upperBarLeft">
        <!-- 로고 이미지 + 홈화면 링크 -->
            <a href="./onboarding.html">
                <img src="../images/logo.png" alt="당근로고" class="upperLogo">
            </a>
            <!-- 로고 이미지 옆 버튼 묶음 div -->
            <!-- 현재 페이지면 주황. 동네인증은 로그인 후에만 보임 -->
            <div class="upperLeftText">
                <a href="./trade.html" id="tradeNav">중고거래</a>
                <a href="./location.html" id="locationNav" hidden>동네인증</a>
            </div>
        </nav>
        <!-- header 내부 섹션2 : flex, gap이 10으로 동일하기 때문에 따로 나눠서 감싸지 않음-->
        <div id="upperBarRight">
            <!-- 검색창 js로 엔터눌러 검색 등을 하기 위해 form으로 감쌈-->
            <!-- 작은 화면은 돋보기로 검색창을 열고 닫음 -->
            <div class="searchWrap">
                <button type="button" id="searchToggle" aria-label="검색 열기" aria-expanded="false">
                    <img src="../images/icon-search.svg" alt="돋보기버튼">
                </button>
                <form id="searchForm">
                    <input type="search" name="search" id="searchTextArea" placeholder="물품이나 동네를 검색해보세요">
                </form>
            </div>
            <!-- 로그아웃 상태에서만 보일 버튼 -->
            <div id="logoutStatusHeader">
                <a href="./login.html" id="upperLoginButton">로그인</a>
            </div>
            
            <!-- 로그인 상태에서만 보일 버튼 -->
            <div id="loginStatusHeader" hidden>
                <!-- 채팅하기버튼 -->
                <a href="./chat.html" id="upperChatButton">채팅하기</a>
                <!-- 로그아웃버튼 -->
                <button type="button" id="upperLogoutButton">로그아웃</button>
                <!-- 프로필 버튼 -->
                <div class="profileDropdown">
                    <button type="button" id="profileButton" aria-label="프로필 메뉴" aria-expanded="false">
                        <img src="../images/profile.svg" alt="" class="defaultIcon"/>
                    </button>
                    <!-- 모바일에서만 열림. 데스크톱은 프로필 클릭 시 마이페이지 -->
                    <ul id="dropdownMenu" hidden>
                        <li><a href="./mypage.html">마이페이지</a></li>
                        <li><a href="./chat.html">채팅</a></li>
                        <li><button type="button" class="dropdown-logout">로그아웃</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <main class="location">
    <section class="location-box">

        <div class="location-set">
        <label class="location-label" data-role="title">어디에 살고 계신가요?</label>
            <div class="input-row">
                <input type="text" class="location-input" placeholder="예) 서울 강서구 화곡동" data-role="input">
                <button class="btn-outline" data-role="edit-btn">내 동네 설정</button>
                <ul class="location-results" data-role="search-results" hidden></ul>
            </div>
            <p class="location-status" data-role="set-status"></p>
        </div>

        <div class="location-verify">
            <p class="location-label">현재 위치로 동네 인증하기</p>
            
            <iframe id="map" class="location-map" title="지도"></iframe>
            
            <p class="location-status" data-role="status"></p>
            
            <button class="btn-confirm" data-role="confirm-btn" disabled>동네인증 완료하기</button>
        </div>
    
    </section>

    <!-- 에러 메세지 모달 -->
    <div class="modal-overlay" data-role="distance-modal" hidden>
        <div class="modal-box">
            <p class="modal-message">실제 계신 위치와 너무 멀어서<br>인증할 수 없어요.</p>
            <div class="modal-actions">
                <button type="button" class="btn-modal-cancel" data-role="modal-cancel">취소</button>
                <button type="button" class="btn-modal-edit" data-role="modal-edit">동네 수정하기</button>
            </div>
        </div>
    </div>
    </main>

    <script src="../js/common.js"></script>
    <!-- 지도 API 스크립트는 여기에 (예: 카카오맵 SDK) -->
    <script src="../js/location.js"></script>
    <script src="../js/header.js"></script>
    

</body>
</html>
